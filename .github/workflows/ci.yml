name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift package (build + tests)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the newest Xcode on the runner
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Build
        run: swift build --build-tests
      - name: Test
        env:
          # Skip suites that drive the real desktop, Keychain or system voices: a headless runner cannot answer
          # their permission prompts.
          FRIDAY_HEADLESS_CI: "1"
        run: |
          # Parallel, like a developer machine. Tests must not park Swift concurrency's cooperative threads (the
          # 3-core runners have three): blocking work goes through offPool() in the test helpers (#8).
          swift test --skip-build > test.log 2>&1 &
          pid=$!
          for _ in $(seq 1 150); do kill -0 "$pid" 2>/dev/null || break; sleep 10; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::swift test still running after 25 minutes — stack samples of the test processes follow"
            for p in $(pgrep -f 'swiftpm-testing-helper|xctest'); do
              sample "$p" 3 -file "sample-$p.txt" >/dev/null 2>&1 && grep -E 'Thread_|Tests|Friday|WakeWord|Sherpa' "sample-$p.txt" | head -150
            done
            tail -60 test.log
            kill "$pid"; exit 1
          fi
          status=0; wait "$pid" || status=$?
          grep -E '✘|error:|Test run with|Executed [0-9]+ tests' test.log | tail -60
          exit "$status"

  install:
    name: Clean install (fetch models + build Friday.app)
    if: github.event_name != 'pull_request'
    needs: swift
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch pinned, checksum-verified speech libraries and models
        run: |
          Scripts/fetch-sherpa.sh
          Scripts/fetch-speech-models.sh
      - name: Build the app exactly as `make app` does
        run: |
          xcodegen generate
          xcodebuild -project Friday.xcodeproj -scheme Friday -configuration Debug -derivedDataPath build/DerivedData build \
            > xcodebuild.log 2>&1 || { grep -nE "error|Stack dump|signal|Assertion" xcodebuild.log | head -80; tail -40 xcodebuild.log; exit 1; }
          grep -E "BUILD SUCCEEDED" xcodebuild.log
      - name: Keep the build log when the build fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
      - name: The built app and its helpers are present
        run: |
          app=build/DerivedData/Build/Products/Debug/Friday.app
          test -x "$app/Contents/MacOS/Friday"
          test -x "$app/Contents/Helpers/fridayctl"
          "$app/Contents/Helpers/fridayctl" --help | head -3

  sidecar:
    name: Python sidecar (lint + tests)
    runs-on: macos-15 # Apple Silicon: the sidecar depends on MLX
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Sidecar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: Sidecar/uv.lock
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest tests --ignore=tests/integration -q

  scripts:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --severity=warning Scripts/*.sh

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false
