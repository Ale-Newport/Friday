name: Release

# Builds the downloadable app for a published release and attaches it, with its checksum, a build-provenance
# attestation and the corresponding source of the copyleft components. Releases (and their tags) can only be created
# by the repository owner (tag ruleset); this workflow only adds files to an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (e.g. v0.2.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  app:
    name: Build and attach Friday.app
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write        # upload the release assets
      id-token: write        # sign the provenance attestation
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          brew install xcodegen
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: Sidecar/uv.lock
      - name: Build the release
        run: Scripts/build-release.sh "${TAG#v}"
      - name: Smoke-test the built app
        run: |
          app="dist/Friday-${TAG#v}-macos-arm64/Friday.app"
          ctl="$app/Contents/Helpers/fridayctl"
          "$ctl" --help | head -2
          open "$app"
          for _ in $(seq 1 60); do "$ctl" --ping --timeout 2 >/dev/null 2>&1 && break; sleep 2; done
          "$ctl" --ping --timeout 5
          test "$("$ctl" --timeout 30 "what's 18% of 2,450?")" = "441"
          "$ctl" --timeout 30 "convert 26.2 miles to kilometers"
          osascript -e 'tell application id "com.alejandro.friday" to quit' || true
      - name: Corresponding source of the copyleft components
        run: Scripts/fetch-corresponding-source.sh dist/source
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Friday-*-macos-arm64.zip
      - name: Attach to the release
        run: |
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            dist/Friday-*-macos-arm64.zip dist/Friday-*-macos-arm64.zip.sha256 dist/source/*
      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-log
          path: dist.xcodebuild.log
          retention-days: 7
