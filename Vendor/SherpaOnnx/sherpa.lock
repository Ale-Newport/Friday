# Pinned sherpa-onnx artifacts for macOS (free, local keyword spotting, text-to-speech and voice activity — no account,
# key or network). The library is the full "shared-lib" build: the "no-tts" variant exports the same text-to-speech
# entry points as stubs that return NULL, so Kokoro (Vendor/Speech, Scripts/fetch-speech-models.sh) needs this one.
#
# Sources : https://github.com/k2-fsa/sherpa-onnx  (release v1.13.8, and its `kws-models` release)
# Licences: sherpa-onnx Apache-2.0 (Vendor/SherpaOnnx/LICENSE); ONNX Runtime, which ships inside the library
#           archive, MIT (Vendor/SherpaOnnx/LICENSE.onnxruntime); the keyword-spotting models: see docs/LICENSING_AND_PRIVACY.md.
#
# Every archive is verified against the SHA-256 below before anything is extracted; a mismatch installs nothing.
# To upgrade: change the URLs and digests, re-run Scripts/fetch-sherpa.sh --force, inspect, and re-pin the header too.
#
#   HEADER  <sha256>   <path of the vendored C header, relative to the repository>
#   ARCHIVE <name> <sha256> <url>
#   EXTRACT <name> <path inside the archive> <destination below Vendor/SherpaOnnx>      (only what the app needs)

