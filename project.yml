# XcodeGen specification for Friday.app. Generate with `xcodegen generate` (or `make project`); the .xcodeproj is not committed.
name: Friday

options:
  bundleIdPrefix: com.alejandro
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: false
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  FridayKit:
    path: .

targets:
  Friday:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
        excludes: ["README*", "LaunchAgents/**"]
      # The launchd plist of the rain-check condition agent. SMAppService.agent(plistName:) looks for it in
      # Contents/Library/LaunchAgents; its BundleProgram points at the agent embedded in Contents/Library/LoginItems.
      - path: Resources/LaunchAgents/com.alejandro.friday.conditions.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - target: FridayConditionAgent
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
      - package: FridayKit
        product: WakeWordKit
      - package: FridayKit
        product: FridayAudio
      - package: FridayKit
        product: WakeWordCore
      - package: FridayKit
        product: FridayPlatform
      - package: FridayKit
        product: SherpaOnnxBackend
      - package: FridayKit
        product: PorcupineBackend
      - package: FridayKit
        product: FridayCore
      - package: FridayKit
        product: FridayInterpreter
      - package: FridayKit
        product: FridayIntegrations
      - package: FridayKit
        product: FridayIPC
      - package: FridayKit
        product: FridayIntelligence
      - package: FridayKit
        product: FridaySpeech
      - package: FridayKit
        product: SherpaOnnxSpeech
      - package: FridayKit
        product: FridayMemory
      - package: FridayKit
        product: FridayComputer
      - package: FridayKit
        product: FridayBrowser
      - package: FridayKit
        product: FridaySidecar
      - package: FridayKit
        product: FridayAssistant
      - target: fridayctl
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Friday
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Friday.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Embed speech engines, models and the browser sidecar
        script: '"${SRCROOT}/Scripts/embed-engine-files.sh"'
        basedOnDependencyAnalysis: false

  # The rain-check condition agent (from Apple-Integrations): a UI-less app bundle that launchd runs every 15 minutes
  # once the user enables it in Settings ▸ Integrations ▸ Future conditions. Embedded in Friday.app by the Friday
  # target; the constants it shares with the app live in FridayIntegrations' ConditionService.
  FridayConditionAgent:
    type: application
    platform: macOS
    sources:
      - path: Agent
        excludes: [Info.plist]
    dependencies:
      - package: FridayKit
        product: FridayCore
      - package: FridayKit
        product: FridayIntegrations
    settings:
      base:
        PRODUCT_NAME: Friday Condition Agent
        PRODUCT_BUNDLE_IDENTIFIER: com.alejandro.friday.ConditionAgent
        INFOPLIST_FILE: Agent/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: ""
        SKIP_INSTALL: YES

  fridayctl:
    type: tool
    platform: macOS
    sources:
      - path: Sources/fridayctl
    dependencies:
      - package: FridayKit
        product: FridayIPC
      - package: FridayKit
        product: FridayCore
    settings:
      base:
        PRODUCT_NAME: fridayctl
        PRODUCT_BUNDLE_IDENTIFIER: com.alejandro.friday.fridayctl
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES

schemes:
  Friday:
    build:
      targets:
        Friday: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: FridayKit/FridayCoreTests
        - package: FridayKit/FridayIntelligenceTests
        - package: FridayKit/FridayAssistantTests
    archive:
      config: Release
